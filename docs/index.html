<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Writing Gym</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>IELTS Writing Gym</h1>
    <p class="sub">Bài tập ngắn 5–40 phút · Nhờ Claude Code tạo đề mới và chấm bài</p>
    <div id="streak" class="streak"></div>
  </header>

  <main>
    <section class="card">
      <h2>1. Chọn bài tập</h2>
      <div class="row">
        <select id="filter">
          <option value="all">Tất cả</option>
          <option value="drill">Bài tập ngắn</option>
          <option value="forum2" selected>Đề thật Task 2 (The Forum)</option>
          <option value="forum1">Đề thật Task 1 (The Forum)</option>
        </select>
        <input id="search" type="text" placeholder="Tìm theo từ khoá, ví dụ: environment">
        <button id="random" class="ghost">🎲 Ngẫu nhiên</button>
      </div>
      <p id="list-count" class="note"></p>
      <div id="exercise-list" class="grid"></div>
    </section>

    <section id="task-panel" class="card hidden">
      <p id="task-meta" class="note"></p>
      <h2 id="task-title"></h2>
      <div id="step-tabs" class="row"></div>
      <p id="task-instructions" class="instructions"></p>
      <div id="task-text" class="task-text"></div>
      <p id="video-box" class="note hidden">Nguồn: <a id="video-link" target="_blank" rel="noopener"></a></p>
      <p class="note">Gợi ý thời gian: <span id="task-time"></span> phút · <span id="timer">00:00</span></p>
      <textarea id="answer" rows="10" placeholder="Viết câu trả lời của bạn ở đây..."></textarea>
      <div class="row">
        <span id="word-count" class="note">0 từ</span>
        <button id="reveal" class="ghost">Xem đáp án mẫu</button>
        <button id="copy">Copy để nhờ Claude chấm</button>
        <button id="done" class="ghost">Đánh dấu đã làm</button>
      </div>
      <div id="reference-box" class="hidden">
        <h3>Đáp án mẫu</h3>
        <div id="reference" class="task-text"></div>
      </div>
    </section>

    <section class="card">
      <h2>Lịch sử gần đây</h2>
      <ul id="history" class="history"></ul>
    </section>

    <p id="message" class="note"></p>
  </main>

  <script src="exercises.js"></script>
  <script src="forum-prompts.js"></script>
  <script src="app.js"></script>
</body>
</html>
